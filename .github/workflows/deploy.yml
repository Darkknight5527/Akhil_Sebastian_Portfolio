name: Deploy site (old HTML + new Next.js preview)

# Publishes:
#   /                 -> the HTML site on main (what visitors see)
#   /next/            -> the Next.js version from the `nextjs-redesign` branch
#   /compare.html     -> both side by side
# Runs on every push to main. After pushing to nextjs-redesign, re-run it
# from the Actions tab ("Run workflow") or push anything to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the live HTML site (main)
        uses: actions/checkout@v4
        with:
          path: site-src

      - name: Check out the Next.js version
        uses: actions/checkout@v4
        with:
          ref: nextjs-redesign
          path: next-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-src/package-lock.json

      - name: Build the Next.js version into /next/
        working-directory: next-src
        env:
          NEXT_BASE_PATH: /Akhil_Sebastian_Portfolio/next
        run: npm ci && npm run build

      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github site-src/ _site/
          mkdir _site/next
          cp -r next-src/out/. _site/next/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
