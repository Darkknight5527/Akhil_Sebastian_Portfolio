name: Deploy site

# Builds the Next.js site on main and publishes it to GitHub Pages at
# https://darkknight5527.github.io/Akhil_Sebastian_Portfolio/
# Runs on every push to main (or manually from the Actions tab).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        env:
          NEXT_BASE_PATH: /Akhil_Sebastian_Portfolio
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
