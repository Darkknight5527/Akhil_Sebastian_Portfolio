<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Compare versions</title>
<style>
  :root { --bg: #040705; --panel: #0a110d; --line: rgba(255,255,255,.1); --g: #00e57a; --txt: #fff; --mut: rgba(255,255,255,.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0 8px 0 0; font-size: 16px; font-weight: 600; }
  .group { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .group button { border: 0; background: transparent; color: var(--mut); padding: 7px 14px; font: inherit; cursor: pointer; }
  .group button[aria-pressed="true"] { background: var(--g); color: #04110a; font-weight: 600; }
  .group button:focus-visible { outline: 2px solid var(--g); outline-offset: -2px; }
  .links { margin-left: auto; display: flex; gap: 14px; }
  .links a { color: var(--mut); text-decoration: none; }
  .links a:hover { color: var(--g); }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .pane[hidden] { display: none; }
  .label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--mut); padding: 0 2px; }
  .label b { color: var(--txt); font-weight: 600; }
  .stage { flex: 1; min-height: 0; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #000; display: flex; justify-content: center; }
  .stage iframe { border: 0; background: #000; transform-origin: top left; position: absolute; top: 0; left: 0; }
  .phone .stage iframe { position: relative; transform: none !important; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  @media (max-width: 760px) { main { flex-direction: column; } .links { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Old vs new</h1>
  <div class="group" role="group" aria-label="Show">
    <button data-show="both" aria-pressed="true">Side by side</button>
    <button data-show="old" aria-pressed="false">Old only</button>
    <button data-show="new" aria-pressed="false">New only</button>
  </div>
  <div class="group" role="group" aria-label="Screen size">
    <button data-size="desktop" aria-pressed="true">Desktop</button>
    <button data-size="phone" aria-pressed="false">Phone</button>
  </div>
  <div class="links">
    <a href="./" target="_blank" rel="noopener">Open old ↗</a>
    <a href="./next/" target="_blank" rel="noopener">Open new ↗</a>
  </div>
</header>
<main id="main">
  <section class="pane" id="pane-old">
    <div class="label"><b>Old · HTML (live site)</b><span id="info-old"></span></div>
    <div class="stage"><iframe id="f-old" src="./" title="Old version"></iframe></div>
  </section>
  <section class="pane" id="pane-new">
    <div class="label"><b>New · Next.js (preview)</b><span id="info-new"></span></div>
    <div class="stage"><iframe id="f-new" src="./next/" title="New version"></iframe></div>
  </section>
</main>
<script>
  // Each version is rendered at a real device width, then scaled to fit its pane,
  // so side-by-side shows the true desktop layout instead of a squeezed one.
  var DESKTOP_W = 1280, PHONE_W = 390;
  var state = { show: "both", size: "desktop" };
  var main = document.getElementById("main");

  function fit() {
    main.classList.toggle("phone", state.size === "phone");
    document.getElementById("pane-old").hidden = state.show === "new";
    document.getElementById("pane-new").hidden = state.show === "old";
    ["old", "new"].forEach(function (k) {
      var f = document.getElementById("f-" + k), stage = f.parentElement;
      var sw = stage.clientWidth, sh = stage.clientHeight;
      if (!sw) return;
      if (state.size === "phone") {
        f.style.width = Math.min(PHONE_W, sw) + "px"; f.style.height = sh + "px"; f.style.transform = "";
        document.getElementById("info-" + k).textContent = PHONE_W + " px wide";
      } else {
        var s = Math.min(1, sw / DESKTOP_W);
        f.style.width = DESKTOP_W + "px"; f.style.height = (sh / s) + "px"; f.style.transform = "scale(" + s + ")";
        document.getElementById("info-" + k).textContent = DESKTOP_W + " px wide" + (s < 1 ? " · shown at " + Math.round(s * 100) + "%" : "");
      }
    });
  }

  document.querySelectorAll("button[data-show],button[data-size]").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.dataset.show ? "show" : "size";
      state[key] = b.dataset[key];
      document.querySelectorAll("button[data-" + key + "]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      fit();
    });
  });
  window.addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
